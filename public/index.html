<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talk to Me - Random Stranger Chat</title>
  
  <!-- Stylish Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #0c0d11; color: #ffffff; }
    
    header { 
      background: #14161f; 
      padding: 14px 22px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 1px solid #232635; 
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    
    /* Stylish Brand Title */
    .brand h2 { 
      font-family: 'Playfair Display', serif; 
      font-style: italic; 
      font-size: 1.6rem; 
      font-weight: 700; 
      background: linear-gradient(135deg, #ffffff 30%, #8ec5fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }
    
    .online-badge { font-size: 0.8rem; background: #1c202e; color: #10b981; padding: 4px 12px; border-radius: 20px; font-weight: 600; border: 1px solid #243044; }

    .header-actions { display: flex; gap: 10px; }
    .btn-share { background: #25D366; color: white; padding: 8px 16px; border: none; border-radius: 20px; text-decoration: none; font-size: 13px; font-weight: 600; display: flex; align-items: center; }
    .btn-next { background: #ff4757; color: #ffffff; padding: 8px 18px; border: none; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 700; transition: transform 0.1s ease; }
    .btn-next:active { transform: scale(0.96); }

    #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #0c0d11; }
    .msg { padding: 12px 18px; border-radius: 18px; max-width: 75%; word-break: break-word; font-size: 15px; line-height: 1.45; }
    .you { background: #2f3542; color: #ffffff; align-self: flex-end; border-bottom-right-radius: 4px; border: 1px solid #404556; }
    .stranger { background: #1a1e2d; color: #e4e6eb; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #2b324a; }
    .system { background: #171f1a; color: #4cd137; align-self: center; font-size: 0.85em; border-radius: 20px; padding: 6px 16px; border: 1px solid #1e3a24; text-align: center; }
    
    #typingIndicator { font-size: 0.85em; color: #9ca3af; font-style: italic; min-height: 18px; margin-bottom: 6px; padding-left: 6px; }

    #controls-container { padding: 14px 18px; background: #14161f; border-top: 1px solid #232635; }
    #controls { display: flex; gap: 10px; }
    input { flex: 1; padding: 13px 20px; border: 1px solid #2d3246; border-radius: 26px; font-size: 15px; outline: none; background: #1c202e; color: #fff; }
    input:focus { border-color: #70a1ff; }
    input::placeholder { color: #6b7280; }
    
    .btn-send { background: #2ed573; color: white; padding: 10px 24px; border: none; border-radius: 26px; cursor: pointer; font-size: 15px; font-weight: 700; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h2>Talk to Me</h2>
      <span class="online-badge" id="onlineCount">● 1 Online</span>
    </div>
    <div class="header-actions">
      <a href="https://api.whatsapp.com/send?text=Chat%20with%20random%20people%20anonymously%20here:%20https://heyitsme-1.onrender.com" target="_blank" class="btn-share">Invite</a>
      <button class="btn-next" id="nextBtn">Next Stranger</button>
    </div>
  </header>

  <div id="chat-box"></div>

  <div id="controls-container">
    <div id="typingIndicator"></div>
    <form id="controls">
      <input type="text" id="msgInput" placeholder="Type a message..." disabled autocomplete="off" />
      <button type="submit" class="btn-send" id="sendBtn" disabled>Send</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const chatBox = document.getElementById('chat-box');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const nextBtn = document.getElementById('nextBtn');
    const form = document.getElementById('controls');
    const onlineBadge = document.getElementById('onlineCount');
    const typingIndicator = document.getElementById('typingIndicator');

    let typingTimeout;

    function addMessage(text, type) {
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.innerText = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    nextBtn.addEventListener('click', () => {
      chatBox.innerHTML = '';
      typingIndicator.innerText = '';
      msgInput.disabled = true;
      sendBtn.disabled = true;
      socket.emit('find_partner');
    });

    socket.on('online_count', (count) => {
      onlineBadge.innerText = `● ${count} Online`;
    });

    socket.on('waiting', (msg) => {
      addMessage(msg, 'system');
    });

    socket.on('chat_start', (msg) => {
      addMessage(msg, 'system');
      msgInput.disabled = false;
      sendBtn.disabled = false;
      msgInput.focus();
    });

    socket.on('receive_message', (msg) => {
      typingIndicator.innerText = '';
      addMessage("Stranger: " + msg, 'stranger');
    });

    socket.on('stranger_typing', (isTyping) => {
      typingIndicator.innerText = isTyping ? "Stranger is typing..." : "";
    });

    socket.on('partner_disconnected', () => {
      addMessage('Stranger has disconnected.', 'system');
      typingIndicator.innerText = '';
      msgInput.disabled = true;
      sendBtn.disabled = true;
    });

    msgInput.addEventListener('input', () => {
      socket.emit('typing', true);
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        socket.emit('typing', false);
      }, 1000);
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = msgInput.value.trim();
      if (!text) return;
      socket.emit('typing', false);
      socket.emit('send_message', text);
      addMessage("You: " + text, 'you');
      msgInput.value = '';
    });

    socket.emit('find_partner');
  </script>
</body>
</html>
